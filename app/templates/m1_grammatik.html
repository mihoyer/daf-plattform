<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M1 Grammatik & Wortschatz – DaF Sprachdiagnostik</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand"><div class="brand-icon">🎓</div>DaF Sprachdiagnostik</a>
    <div class="badge badge-primary">📝 M1 – Grammatik &amp; Wortschatz</div>
  </div>
</nav>

<div class="container-sm" style="padding-top:2rem; padding-bottom:4rem;">

  <!-- Lade-Bereich -->
  <div id="lade-bereich" class="text-center" style="padding:4rem 0;">
    <div class="spinner" style="margin:0 auto 1rem;"></div>
    <p class="text-muted" id="lade-text">Aufgaben werden generiert…</p>
  </div>

  <!-- Aufgaben-Bereich -->
  <div id="aufgaben-bereich" class="hidden">
    <!-- Header -->
    <div class="card mb-4" style="background:var(--primary-lighter);">
      <div class="flex justify-between items-center flex-wrap gap-2">
        <div>
          <h2 class="mb-1">Grammatik &amp; Wortschatz</h2>
          <p class="text-sm text-muted">Adaptiver Test · Fragen passen sich deinem Niveau an</p>
        </div>
        <div class="flex gap-2 items-center">
          <span class="badge badge-gray" id="fortschritt-badge">1 / 10</span>
          <span class="badge badge-primary" id="niveau-badge" style="display:none;">Niveau: –</span>
        </div>
      </div>
      <!-- Fortschrittsbalken -->
      <div class="score-bar mt-3">
        <div class="score-bar-fill high" id="fortschritt-balken" style="width:10%;"></div>
      </div>
    </div>

    <!-- Frage-Karte -->
    <div id="frage-container"></div>

    <!-- Feedback nach Antwort -->
    <div id="feedback-bereich" class="hidden mt-4">
      <div id="feedback-karte" class="card" style="border-left:4px solid #22c55e;">
        <p id="feedback-text" class="mb-0"></p>
      </div>
    </div>

    <!-- Weiter-Button -->
    <div class="flex justify-end mt-4">
      <button class="btn btn-primary" id="btn-weiter" onclick="weiter()" disabled>Antwort wählen →</button>
    </div>
  </div>

  <!-- Analyse-Overlay -->
  <div id="analyse-overlay" class="analyse-overlay hidden">
    <div class="analyse-card">
      <div class="spinner"></div>
      <h3>Auswertung läuft…</h3>
      <p class="text-muted mt-2">Deine Antworten werden analysiert.</p>
    </div>
  </div>
</div>

<script>
const token = '{{ token }}';
const GESAMT_FRAGEN = 10;

// Zustand
let alleFragen = [];          // alle bisher gezeigten Fragen
let antworten = {};           // {item_id: gewaehlter_index}
let aktuelleFrageIdx = 0;    // Index in alleFragen (0-basiert)
let gewaehltOption = null;    // aktuell gewählte Option
let geschaetztesNiveau = 'B1';
let phase = 'einstieg';       // 'einstieg' | 'adaptiv' | 'fertig'
let wartendAufNaechste = false;

// ── Start ──────────────────────────────────────────────────────────────────

async function ladeEinstiegsfragen() {
  try {
    const res = await fetch(`/api/m1/${token}/items`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    alleFragen = data.items || [];
    geschaetztesNiveau = data.geschaetztes_niveau || 'B1';

    document.getElementById('lade-bereich').classList.add('hidden');
    document.getElementById('aufgaben-bereich').classList.remove('hidden');

    zeigeAktuelleFrage();
  } catch (e) {
    document.getElementById('lade-text').textContent = 'Fehler beim Laden. Bitte Seite neu laden.';
    console.error(e);
  }
}

// ── Frage anzeigen ─────────────────────────────────────────────────────────

function zeigeAktuelleFrage() {
  const frage = alleFragen[aktuelleFrageIdx];
  if (!frage) return;

  gewaehltOption = null;
  document.getElementById('feedback-bereich').classList.add('hidden');
  document.getElementById('btn-weiter').disabled = true;
  document.getElementById('btn-weiter').textContent = 'Antwort wählen →';

  // Fortschritt
  const frageNr = aktuelleFrageIdx + 1;
  document.getElementById('fortschritt-badge').textContent = `${frageNr} / ${GESAMT_FRAGEN}`;
  document.getElementById('fortschritt-balken').style.width = `${(frageNr / GESAMT_FRAGEN) * 100}%`;

  // Niveau-Badge ab Frage 4 anzeigen
  const niveauBadge = document.getElementById('niveau-badge');
  if (aktuelleFrageIdx >= 3) {
    niveauBadge.style.display = '';
    niveauBadge.textContent = `Niveau: ${geschaetztesNiveau}`;
  }

  // Frage-Karte rendern
  const container = document.getElementById('frage-container');
  const bereitsBeantwortet = antworten[frage.id] !== undefined;
  const gewaehlt = antworten[frage.id] ?? null;

  container.innerHTML = `
    <div class="card">
      <div class="text-xs text-muted mb-3" style="display:flex; gap:.5rem; align-items:center;">
        <span>Frage ${frageNr}</span>
        ${frage.thema ? `<span style="background:var(--primary-lighter); padding:2px 8px; border-radius:12px;">${frage.thema}</span>` : ''}
      </div>
      <h3 class="mb-5" style="font-size:1.15rem; line-height:1.6;">${frage.frage}</h3>
      <div id="optionen-liste">
        ${frage.optionen.map((opt, i) => `
          <label class="mc-option ${bereitsBeantwortet && gewaehlt === i ? 'selected' : ''}"
                 onclick="${bereitsBeantwortet ? '' : `waehleAntwort(${i})`}"
                 style="${bereitsBeantwortet ? 'cursor:default;' : ''}">
            <input type="radio" name="antwort" value="${i}" ${bereitsBeantwortet && gewaehlt === i ? 'checked' : ''} ${bereitsBeantwortet ? 'disabled' : ''}>
            <span class="option-buchstabe">${['A','B','C','D'][i]}</span>
            ${opt}
          </label>
        `).join('')}
      </div>
    </div>
  `;

  // Wenn bereits beantwortet: Feedback sofort zeigen
  if (bereitsBeantwortet) {
    const istKorrekt = gewaehlt === frage.korrekt;
    zeigeFeedback(istKorrekt, frage.erklaerung, frage.optionen[frage.korrekt]);
    document.getElementById('btn-weiter').disabled = false;
    document.getElementById('btn-weiter').textContent =
      aktuelleFrageIdx < GESAMT_FRAGEN - 1 ? 'Weiter →' : 'Auswertung starten →';
  }
}

// ── Antwort wählen ─────────────────────────────────────────────────────────

async function waehleAntwort(optionIdx) {
  if (gewaehltOption !== null || wartendAufNaechste) return;
  gewaehltOption = optionIdx;

  const frage = alleFragen[aktuelleFrageIdx];
  antworten[frage.id] = optionIdx;

  // Gewählte Option markieren
  document.querySelectorAll('.mc-option').forEach((el, i) => {
    el.classList.toggle('selected', i === optionIdx);
    el.style.cursor = 'default';
    el.onclick = null;
  });

  const istKorrekt = optionIdx === frage.korrekt;

  // Wenn noch nicht letzte Frage: nächste Frage vom Server holen (adaptiv)
  const istLetzte = aktuelleFrageIdx >= GESAMT_FRAGEN - 1;
  const istEinstiegsphase = aktuelleFrageIdx < alleFragen.length - 1;

  if (!istLetzte && !istEinstiegsphase) {
    // Adaptive Phase: nächste Frage vom Server anfordern
    wartendAufNaechste = true;
    document.getElementById('btn-weiter').textContent = 'Nächste Frage wird generiert…';
    document.getElementById('btn-weiter').disabled = true;

    try {
      const res = await fetch(`/api/m1/${token}/naechste`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: frage.id, gewaehlt: optionIdx }),
      });
      const data = await res.json();
      alleFragen.push(data.frage);
      geschaetztesNiveau = data.geschaetztes_niveau || geschaetztesNiveau;
    } catch (e) {
      console.error('Fehler beim Laden der nächsten Frage:', e);
    }
    wartendAufNaechste = false;
  }

  zeigeFeedback(istKorrekt, frage.erklaerung, frage.optionen[frage.korrekt]);

  document.getElementById('btn-weiter').disabled = false;
  document.getElementById('btn-weiter').textContent =
    istLetzte ? 'Auswertung starten →' : 'Weiter →';
}

// ── Feedback ───────────────────────────────────────────────────────────────

function zeigeFeedback(istKorrekt, erklaerung, korrektText) {
  const bereich = document.getElementById('feedback-bereich');
  const karte = document.getElementById('feedback-karte');
  const text = document.getElementById('feedback-text');

  karte.style.borderLeftColor = istKorrekt ? '#22c55e' : '#ef4444';
  text.innerHTML = istKorrekt
    ? `<strong style="color:#22c55e;">✓ Richtig!</strong> ${erklaerung || ''}`
    : `<strong style="color:#ef4444;">✗ Leider falsch.</strong> Die richtige Antwort ist: <strong>${korrektText}</strong>. ${erklaerung || ''}`;

  bereich.classList.remove('hidden');
}

// ── Navigation ─────────────────────────────────────────────────────────────

async function weiter() {
  if (aktuelleFrageIdx >= GESAMT_FRAGEN - 1) {
    await sendeEndauswertung();
    return;
  }

  aktuelleFrageIdx++;

  // Falls wir in der Einstiegsphase noch vorhandene Fragen haben
  if (aktuelleFrageIdx < alleFragen.length) {
    zeigeAktuelleFrage();
  } else {
    // Sollte nicht passieren (nächste Frage wurde bereits geladen)
    document.getElementById('btn-weiter').disabled = true;
    document.getElementById('btn-weiter').textContent = 'Wird geladen…';
    // Kurz warten und neu prüfen
    setTimeout(() => {
      if (aktuelleFrageIdx < alleFragen.length) zeigeAktuelleFrage();
    }, 500);
  }
}

// ── Endauswertung ──────────────────────────────────────────────────────────

async function sendeEndauswertung() {
  document.getElementById('analyse-overlay').classList.remove('hidden');

  // Antworten als {item_id_string: option_index}
  const antwortenPayload = {};
  alleFragen.forEach(f => {
    if (antworten[f.id] !== undefined) {
      antwortenPayload[String(f.id)] = antworten[f.id];
    }
  });

  try {
    const res = await fetch(`/api/m1/${token}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ antworten: antwortenPayload }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const naechste = await naechstesModul();
    window.location.href = naechste || `/ergebnis/${token}`;
  } catch (e) {
    document.getElementById('analyse-overlay').classList.add('hidden');
    alert('Fehler bei der Auswertung. Bitte versuche es erneut.');
    console.error(e);
  }
}

async function naechstesModul() {
  try {
    const r = await fetch(`/api/session/${token}/status`);
    const s = await r.json();
    const naechstes = s.module.find(m => m.status === 'ausstehend');
    if (naechstes) return `/${naechstes.modul.split('_')[0]}/${token}`;
  } catch(e) {}
  return null;
}

// ── Init ───────────────────────────────────────────────────────────────────
ladeEinstiegsfragen();
</script>
</body>
</html>
