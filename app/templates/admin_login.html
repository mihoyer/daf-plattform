<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – DaF Sprachdiagnostik</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body style="background:var(--gray-100); min-height:100vh; display:flex; align-items:center; justify-content:center;">
<div style="width:100%; max-width:400px; padding:1.5rem;">
  <div class="text-center mb-8">
    <div class="brand-icon" style="width:56px; height:56px; font-size:1.5rem; margin:0 auto 1rem;">🎓</div>
    <h2>Admin-Zugang</h2>
    <p class="text-muted text-sm mt-1">DaF Sprachdiagnostik</p>
  </div>
  <div class="card">
    {% if fehler %}
    <div class="alert alert-danger mb-4">
      <span class="alert-icon">⚠️</span>
      <div>{{ fehler }}</div>
    </div>
    {% endif %}
    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label class="form-label">Passwort</label>
        <input type="password" name="passwort" class="form-input" placeholder="Admin-Passwort" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-full mt-4">Anmelden →</button>
    </form>
  </div>
  <p class="text-center text-xs text-muted mt-4"><a href="/">← Zurück zur Startseite</a></p>
</div>
</body>
</html>
