<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M2 Lesen – DaF Sprachdiagnostik</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand"><div class="brand-icon">🎓</div>DaF Sprachdiagnostik</a>
    <div class="badge badge-primary">📖 M2 – Lesen &amp; Leseverstehen</div>
  </div>
</nav>

<div class="container-sm" style="padding-top:2rem; padding-bottom:4rem;">
  <div id="lade-bereich" class="text-center" style="padding:4rem 0;">
    <div class="spinner" style="margin:0 auto 1rem;"></div>
    <p class="text-muted">Text wird generiert…</p>
  </div>

  <div id="aufgabe-bereich" class="hidden">
    <div class="card mb-6" style="background:var(--primary-lighter);">
      <h2 class="mb-1">Lesen &amp; Leseverstehen</h2>
      <p class="text-sm text-muted">Lies den Text sorgfältig und beantworte die Fragen.</p>
    </div>

    <!-- Lesetext -->
    <div class="card mb-6">
      <h4 class="mb-3" id="text-titel">–</h4>
      <div id="lesetext" style="line-height:1.8; color:var(--gray-900);"></div>
    </div>

    <!-- Fragen -->
    <div id="fragen-bereich">
      <h3 class="mb-4">Verständnisfragen</h3>
      <div id="fragen-liste"></div>
      <button class="btn btn-primary mt-4" id="btn-auswerten" onclick="auswerten()" disabled>Auswerten →</button>
    </div>
  </div>

  <div id="analyse-overlay" class="analyse-overlay hidden">
    <div class="analyse-card">
      <div class="spinner"></div>
      <h3>Auswertung läuft…</h3>
    </div>
  </div>
</div>

<script>
const token = '{{ token }}';
let fragen = [];
let antworten = {};

async function ladeAufgabe() {
  try {
    const res = await fetch(`/api/m2/${token}/aufgabe`);
    const data = await res.json();
    document.getElementById('text-titel').textContent = data.titel || 'Lesetext';
    document.getElementById('lesetext').innerHTML = data.text.replace(/\n/g, '<br>');
    fragen = data.fragen;
    zeigeFragen();
    document.getElementById('lade-bereich').classList.add('hidden');
    document.getElementById('aufgabe-bereich').classList.remove('hidden');
  } catch (e) {
    document.getElementById('lade-bereich').innerHTML = '<p class="text-muted">Fehler beim Laden.</p>';
  }
}

function zeigeFragen() {
  const container = document.getElementById('fragen-liste');
  fragen.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'card mb-4';
    div.innerHTML = `
      <div class="text-xs text-muted mb-2">Frage ${i+1} von ${fragen.length}</div>
      <h4 class="mb-3">${f.frage}</h4>
      ${f.optionen.map((opt, j) => `
        <label class="mc-option" onclick="waehleAntwort(${i}, ${j})">
          <input type="radio" name="frage_${i}" value="${j}"> ${opt}
        </label>
      `).join('')}
    `;
    container.appendChild(div);
  });
}

function waehleAntwort(frageIndex, optionIndex) {
  antworten[frageIndex] = optionIndex;
  const allBeantwortet = fragen.every((_, i) => antworten[i] !== undefined);
  document.getElementById('btn-auswerten').disabled = !allBeantwortet;
}

async function auswerten() {
  document.getElementById('analyse-overlay').classList.remove('hidden');
  // Backend erwartet: { antworten: {"0": 2, "1": 0, ...} } (Index als String → gewählter Index)
  const antwortenPayload = {};
  fragen.forEach((f, i) => { antwortenPayload[String(i)] = antworten[i] ?? -1; });
  try {
    const res = await fetch(`/api/m2/${token}/submit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ antworten: antwortenPayload }),
    });
    const data = await res.json();
    window.location.href = await naechstesModul() || `/ergebnis/${token}`;
  } catch (e) {
    document.getElementById('analyse-overlay').classList.add('hidden');
    alert('Fehler bei der Auswertung.');
  }
}

async function naechstesModul() {
  try {
    const r = await fetch(`/api/session/${token}/status`);
    const s = await r.json();
    const naechstes = s.module.find(m => m.status === 'ausstehend');
    if (naechstes) return `/${naechstes.modul.split('_')[0]}/${token}`;
  } catch(e) {}
  return null;
}

ladeAufgabe();
</script>
</body>
</html>
